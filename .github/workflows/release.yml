name: Release
# Pushing a v* tag is the explicit release decision.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match manifest version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: npm test
      - run: node scripts/pack.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/ram-nudge-*-chrome.zip dist/SHA256SUMS.json
      - name: Refresh website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
