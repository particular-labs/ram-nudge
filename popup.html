<!doctype html>
<meta charset="utf-8">
<title data-i18n="extName"></title>
<link rel="stylesheet" href="styles.css">
<style>body { width: 320px; box-sizing: border-box; }</style>
<main>
  <div id="pebble" data-stage="1" aria-hidden="true"></div>
  <h1 id="state" role="status"></h1>
  <p id="detail" class="muted"></p>
  <button id="restart" data-i18n="restartBtn"></button>
  <p id="guide" role="status" class="muted"></p>
  <p><button id="sleep" class="link" data-i18n="sleepBtn"></button><br>
     <span id="sleepNote" class="muted" role="status" data-i18n="sleepHint"></span></p>
  <p><button id="setup" class="link" data-i18n="startupLink"></button><br>
     <button id="options" class="link" data-i18n="optionsLink"></button></p>
</main>
<script type="module" src="popup.js"></script>
